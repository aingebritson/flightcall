name: Deploy to GitHub Pages

# Deploys on every push to main. The county list comes from counties.json,
# so new counties deploy automatically once they appear in the manifest —
# no workflow edits needed. The commit step below no-ops when nothing changed.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages
        run: |
          # Switch to gh-pages branch
          git checkout gh-pages

          # Remove all files except .git
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} +

          # Copy landing page, about page, custom domain config, and county manifest to root
          git checkout main -- index.html about.html CNAME counties.json

          # Copy each county app listed in the manifest into its subdirectory
          for slug in $(jq -r '.counties[].slug' counties.json); do
            git checkout main -- "$slug/"
          done

          # Stage all changes
          git add -A

          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy from main branch - $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin gh-pages
          fi
